      - "patient"
      - "reliable"
      - "family-oriented"

  operator:
    operator_hours_per_week: 20.0
    operator_skill_level: "intermediate"
    preferred_channels:
      - "google_ads"
      - "gbp"
      - "website"
    delegation_preferences: "Office managers at each location handle GBP posts and review responses (with training). Central marketing coordinator manages ads, website, and email. Need help with location page SEO, review generation system, bringing underperforming locations up to standard, and building per-location reporting."

  raw_notes: "Founded by Dr. Anita Patel in 2015 with the Dallas office. Expanded to Plano (2017), Arlington (2019), Frisco (2022), and Fort Worth (2025). Company-owned, not franchise. Dr. Patel is the managing partner and still practices 3 days/week in Dallas. The group employs 4 general dentists, 1 orthodontist, 12 hygienists, and 20 support staff across all locations. Dallas and Plano are mature and profitable. Arlington is steady. Frisco is growing slowly — competition is fierce in that market. Fort Worth just opened and needs patient acquisition fast. The biggest pain point is inconsistency — Dallas runs like a well-oiled machine but the newer locations don't have the same review count, GBP activity, or web presence. They want every location to perform like Dallas within 12 months."

  metadata:
    source: "onboarding_interview"
