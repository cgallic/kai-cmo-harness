      - "Your whole family, one Saturday morning, one office. That's Bright Smile Dental."
    approved_messaging_blocks:
      - "Your Neighborhood Dentist. Every Location."
      - "5 Locations Across DFW. Evening & Saturday Hours."
      - "New Patients Welcome — Same-Week Appointments Available"
      - "Gentle Care for Anxious Patients — Sedation Options Available"
    competitor_differentiation: "Unlike corporate dental chains, we are family-owned and every location is staffed by the same core team of dentists who rotate across offices. You see the same doctor every visit. We offer evening and Saturday hours at every location — not just select offices — and we never upsell treatments you don't need."
