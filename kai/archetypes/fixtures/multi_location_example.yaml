  constraints:
    compliance_notes:
      - "HIPAA applies to all patient communications — no patient names, images, or health information without signed authorization"
      - "Texas State Board of Dental Examiners advertising rules — must include dentist name and license number in ads"
      - "Before/after photos require signed patient consent form specific to marketing use"
      - "Sedation dentistry advertising requires dentist to hold active sedation permit"
      - "Specialty claims (orthodontist, oral surgeon) must be for ADA-recognized specialties only"
    regulated_industry: true
    claims_restrictions:
      - "Cannot guarantee treatment outcomes (e.g., 'painless dentistry' or 'guaranteed white teeth')"
      - "Cannot advertise specific prices without disclosing what is and isn't included"
      - "Invisalign ads must use approved trademark language per Align Technology guidelines"
      - "New patient special pricing must clearly state what is included and any exclusions"
      - "Cannot use patient testimonials that imply guaranteed clinical outcomes"
    brand_voice_notes: "Warm, reassuring, family-friendly. We put nervous patients at ease. Professional but never clinical or intimidating. Each location should feel like your neighborhood dentist, not a corporate chain."
    topics_to_avoid:
      - "Graphic dental procedure images without clear patient consent"
      - "Fear-based messaging about dental neglect"
      - "Pricing comparisons with specific competitor practices"
      - "Making claims about insurance coverage without verification"
      - "Implying all locations offer identical specialty services"

