  constraints:
    compliance_notes:
      - "Texas Disciplinary Rules of Professional Conduct govern all attorney advertising"
      - "Must include 'principal office' disclosure in ads if firm has multiple locations"
      - "Cannot designate a lawyer as 'specialist' or 'expert' unless board certified by Texas Board of Legal Specialization"
      - "All ads must include the name of at least one lawyer responsible for content"
      - "Testimonials in ads must include disclaimer: 'Results may vary. Each case is unique.'"
    regulated_industry: true
    claims_restrictions:
      - "Cannot guarantee outcomes or imply guaranteed results"
      - "Cannot state or imply that quality of services is superior to other lawyers unless it can be factually substantiated"
      - "Past results do not guarantee future performance — must include disclaimer with case results"
      - "Cannot solicit clients in person or by phone within 30 days of an accident (barratry rules)"
      - "Medical malpractice ads must comply with Texas Civil Practice & Remedies Code Chapter 74"
    brand_voice_notes: "Compassionate but authoritative. Fighter mentality — we stand up for people who got hurt. No ambulance-chaser energy. Speak plainly, not in legalese. Empathy first, credentials second."
    topics_to_avoid:
      - "Guaranteeing any specific case outcome or dollar amount"
      - "Disparaging other law firms or specific attorneys"
      - "Giving specific legal advice in marketing content (always say 'consult an attorney')"
      - "Using scare tactics about statutes of limitations without proper context"
      - "Discussing specific client cases without written consent"

