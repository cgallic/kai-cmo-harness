name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - codex/*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run Dashboard Compiler
        run: |
          python scripts/build_dashboard.py

      - name: Prepare build directory
        run: |
          mkdir -p build-dist
          cp workspace/dashboard.html build-dist/index.html
          cp workspace/agent_ui_spec.json build-dist/agent_ui_spec.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
